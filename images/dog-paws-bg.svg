<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <!-- Soft warm pastel background -->
    <linearGradient id="pastelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf5" />
      <stop offset="50%" stop-color="#fef5ed" />
      <stop offset="100%" stop-color="#fdf1e6" />
    </linearGradient>

    <!-- Dog Paw Print Symbol (metacarpal pad + 4 toe beans) -->
    <g id="paw">
      <path d="M 0,6 C -5.5,6 -9,2 -7.5,-2 C -6,-5 6,-5 7.5,-2 C 9,2 5.5,6 0,6 Z" />
      <circle cx="-6.8" cy="-6.8" r="2.4" />
      <circle cx="-2.6" cy="-9.8" r="2.6" />
      <circle cx="2.6" cy="-9.8" r="2.6" />
      <circle cx="6.8" cy="-6.8" r="2.4" />
    </g>

    <!-- Cute Dog Bone Symbol -->
    <g id="bone">
      <rect x="-6" y="-1.8" width="12" height="3.6" rx="1.8" />
      <circle cx="-6" cy="-2.2" r="2" />
      <circle cx="-6" cy="2.2" r="2" />
      <circle cx="6" cy="-2.2" r="2" />
      <circle cx="6" cy="2.2" r="2" />
    </g>

    <!-- Soft Heart Symbol -->
    <g id="heart">
      <path d="M 0,3.5 C -3.5,0 -5,-2 -5,-3.8 C -5,-5.8 -2.8,-7 0,-5 C 2.8,-7 5,-5.8 5,-3.8 C 5,-2 3.5,0 0,3.5 Z" />
    </g>
  </defs>

  <!-- Base pastel fill -->
  <rect width="180" height="180" fill="url(#pastelBg)" />

  <!-- Center paw -->
  <use href="#paw" x="90" y="90" transform="rotate(16 90 90) scale(1.15)" fill="#debfa8" opacity="0.36" />

  <!-- Corner paws (wrapping seamlessly across 180x180 grid) -->
  <use href="#paw" x="0" y="0" transform="rotate(-15 0 0) scale(1.05)" fill="#debfa8" opacity="0.36" />
  <use href="#paw" x="180" y="0" transform="rotate(-15 180 0) scale(1.05)" fill="#debfa8" opacity="0.36" />
  <use href="#paw" x="0" y="180" transform="rotate(-15 0 180) scale(1.05)" fill="#debfa8" opacity="0.36" />
  <use href="#paw" x="180" y="180" transform="rotate(-15 180 180) scale(1.05)" fill="#debfa8" opacity="0.36" />

  <!-- Mid-edge bones (wrapping symmetrically) -->
  <use href="#bone" x="90" y="0" transform="rotate(35 90 0) scale(0.9)" fill="#e5cdbc" opacity="0.32" />
  <use href="#bone" x="90" y="180" transform="rotate(35 90 180) scale(0.9)" fill="#e5cdbc" opacity="0.32" />
  <use href="#bone" x="0" y="90" transform="rotate(-30 0 90) scale(0.9)" fill="#e5cdbc" opacity="0.32" />
  <use href="#bone" x="180" y="90" transform="rotate(-30 180 90) scale(0.9)" fill="#e5cdbc" opacity="0.32" />

  <!-- Offset cute accent paws -->
  <use href="#paw" x="45" y="135" transform="rotate(22 45 135) scale(0.9)" fill="#e2c8b4" opacity="0.32" />
  <use href="#paw" x="135" y="45" transform="rotate(-20 135 45) scale(0.9)" fill="#e2c8b4" opacity="0.32" />

  <!-- Soft hearts -->
  <use href="#heart" x="45" y="45" transform="rotate(-10 45 45) scale(0.9)" fill="#eccfbe" opacity="0.35" />
  <use href="#heart" x="135" y="135" transform="rotate(12 135 135) scale(0.9)" fill="#eccfbe" opacity="0.35" />

  <!-- Delicate accent dots -->
  <circle cx="90" cy="45" r="1.8" fill="#e0c4af" opacity="0.35" />
  <circle cx="90" cy="135" r="1.8" fill="#e0c4af" opacity="0.35" />
  <circle cx="45" cy="90" r="1.8" fill="#e0c4af" opacity="0.35" />
  <circle cx="135" cy="90" r="1.8" fill="#e0c4af" opacity="0.35" />
</svg>
